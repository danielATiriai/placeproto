name: Staging sync

on:
  pull_request:
    types: [labeled, unlabeled, synchronize, closed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: staging-branch
  cancel-in-progress: false

jobs:
  sync:
    name: Point the staging branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the commit staging should show
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_STAGING_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'staging') }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          target=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target="origin/$DEFAULT_BRANCH"
          elif [ "$ACTION" = "closed" ] && [ "$HAS_STAGING_LABEL" = "true" ]; then
            target="origin/$DEFAULT_BRANCH"
          elif [ "$ACTION" = "unlabeled" ] && [ "$LABEL" = "staging" ]; then
            target="origin/$DEFAULT_BRANCH"
          elif [ "$ACTION" != "closed" ] && [ "$ACTION" != "unlabeled" ] && [ "$HAS_STAGING_LABEL" = "true" ]; then
            git fetch origin "$HEAD_SHA"
            target="$HEAD_SHA"
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Move the staging branch
        if: steps.target.outputs.target != ''
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: git push --force origin "$TARGET:refs/heads/staging"
