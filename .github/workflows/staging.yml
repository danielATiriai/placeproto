name: Staging sync

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: staging-branch
  cancel-in-progress: false

jobs:
  sync:
    name: Point the staging branch
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.STAGING_PUSH_TOKEN || github.token }}
      - name: Choose the commit staging should show
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          EVENT_LABEL: ${{ github.event.label.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_UPDATED_AT: ${{ github.event.pull_request.updated_at }}
        run: |
          set -euo pipefail
          staging_rc=0
          git ls-remote --exit-code --heads origin staging >/dev/null || staging_rc=$?
          case "$staging_rc" in
            0) git fetch --no-tags origin \
                 "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" \
                 "+refs/heads/staging:refs/remotes/origin/staging" ;;
            2) git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
               git update-ref -d refs/remotes/origin/staging ;;
            *) exit "$staging_rc" ;;
          esac
          current="$(git rev-parse -q --verify origin/staging || true)"
          candidates="$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq "[.[] | select(.head.repo.full_name == \"$REPO\" and any(.labels[]; .name == \"staging\")) | .number]")"
          dropped=""
          if [ "$EVENT_NAME" = "pull_request_target" ]; then
            if [ "$ACTION" = "closed" ] || { [ "$ACTION" = "unlabeled" ] && [ "$EVENT_LABEL" = "staging" ]; }; then
              dropped="$PR_NUMBER"
            else
              candidates="$(jq -c --argjson n "$PR_NUMBER" '. + [$n] | unique' <<<"$candidates")"
            fi
          fi
          chosen_sha=""
          chosen_at=""
          for number in $(jq -r '.[]' <<<"$candidates"); do
            if [ "$number" = "$dropped" ]; then
              continue
            fi
            record="$(gh api "repos/$REPO/pulls/$number" \
              --jq "{eligible: (.state == \"open\" and .head.repo.full_name == \"$REPO\" and any(.labels[]; .name == \"staging\")), sha: .head.sha}")"
            if [ "$(jq -r '.eligible' <<<"$record")" != "true" ]; then
              continue
            fi
            sha="$(jq -r '.sha' <<<"$record")"
            git fetch --no-tags origin "$sha"
            if git merge-base --is-ancestor "$sha" "origin/$DEFAULT_BRANCH"; then
              continue
            fi
            labeled_at="$(gh api --paginate "repos/$REPO/issues/$number/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "staging") | .created_at' | sort | tail -n 1)"
            if [ "$EVENT_NAME" = "pull_request_target" ] && [ "$ACTION" = "labeled" ] && [ "$EVENT_LABEL" = "staging" ] \
              && [ "$number" = "$PR_NUMBER" ] && [ "$PR_UPDATED_AT" \> "$labeled_at" ]; then
              labeled_at="$PR_UPDATED_AT"
            fi
            labeled_at="${labeled_at:-9999}"
            if [ "$labeled_at" \> "$chosen_at" ]; then
              chosen_at="$labeled_at"
              chosen_sha="$sha"
            fi
          done
          target="$(git rev-parse "${chosen_sha:-origin/$DEFAULT_BRANCH}")"
          if [ "$target" = "$current" ]; then
            target=""
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
      - name: Move the staging branch
        if: steps.target.outputs.target != ''
        env:
          TARGET: ${{ steps.target.outputs.target }}
          CURRENT: ${{ steps.target.outputs.current }}
        run: git push --force-with-lease="refs/heads/staging:$CURRENT" origin "$TARGET:refs/heads/staging"
