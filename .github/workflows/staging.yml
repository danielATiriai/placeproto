name: Staging sync

on:
  pull_request_target:
    types: [labeled, unlabeled, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: staging-branch
  cancel-in-progress: false

jobs:
  sync:
    name: Point the staging branch
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Choose the commit staging should show
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          current="$(git rev-parse -q --verify origin/staging || true)"
          labeled="$(gh api "repos/$REPO/pulls?state=open&per_page=100" \
            --jq "[.[] | select(.head.repo.full_name == \"$REPO\" and any(.labels[]; .name == \"staging\")) | {number, sha: .head.sha}]")"
          chosen_sha=""
          chosen_at=""
          for number in $(jq -r '.[].number' <<<"$labeled"); do
            labeled_at="$(gh api --paginate "repos/$REPO/issues/$number/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" and .label.name == "staging") | .created_at' | sort | tail -n 1)"
            labeled_at="${labeled_at:-9999}"
            if [ "$labeled_at" \> "$chosen_at" ]; then
              chosen_at="$labeled_at"
              chosen_sha="$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .sha' <<<"$labeled")"
            fi
          done
          if [ -n "$chosen_sha" ]; then
            git fetch origin "$chosen_sha"
            target="$chosen_sha"
          else
            target="origin/$DEFAULT_BRANCH"
          fi
          if [ "$(git rev-parse "$target")" = "$current" ]; then
            target=""
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
      - name: Move the staging branch
        if: steps.target.outputs.target != ''
        env:
          TARGET: ${{ steps.target.outputs.target }}
        run: git push --force origin "$TARGET:refs/heads/staging"
